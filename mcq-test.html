<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Tests - Java Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header and Navbar -->
    <div class="top-bar"></div>
    <header class="main-header">
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center">
                <!-- College & Personal Info -->
            </div>
        </div>
    </header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <!-- Navbar Content -->
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="py-5">
        <div class="container">
            <div class="content-box" id="mcq-content-box">
                <!-- Content will be loaded by script.js -->
            </div>
        </div>
    </main>
    
    <!-- JavaScript Files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

    <!-- Toast Notification for Proctoring -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="proctorToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header"><strong class="me-auto">Action Disabled</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div>
            <div class="toast-body">Copy-paste and right-click are disabled during the test.</div>
        </div>
        <div id="visibilityToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
             <div class="toast-header bg-danger text-white"><strong class="me-auto">Warning!</strong><button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button></div>
             <div class="toast-body">You have navigated away from the test. It will be submitted automatically.</div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Java Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Consistent Header and Navbar -->
    <div class="top-bar"></div>
    <header class="main-header">
        <div class="container py-3">
            <!-- Header content here -->
        </div>
    </header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <!-- Navbar content here -->
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="py-5">
        <div class="container">
            <div id="entry-container" class="content-box">
                <h2>MCQ Exam on Java & DSA</h2>
                <p>Please enter your details to begin the test. You will have 30 minutes to complete the questions. This test can only be attempted once.</p>
                <hr>
                <form id="entry-form">
                    <div class="mb-3"><label for="studentId" class="form-label">Enter Your USN Number</label><input type="text" class="form-control" id="studentId" required></div>
                    <div class="mb-3"><label for="studentName" class="form-label">Enter Your Full Name</label><input type="text" class="form-control" id="studentName" required></div>
                    <button type="submit" id="startBtn" class="btn btn-primary btn-lg">Start Test</button>
                </form>
                <div id="entry-error" class="alert alert-danger mt-3 d-none"></div>
            </div>
            <div id="test-container" class="content-box d-none">
                <div class="d-flex justify-content-between align-items-center mb-3"><h2 id="student-info" class="fs-5"></h2><h3 id="timer" class="badge bg-danger p-3 fs-5">Time Left: 30:00</h3></div>
                <hr>
                <form id="exam-form"></form>
            </div>
            <div id="complete-container" class="content-box d-none text-center">
                <h2 class="text-success">Test Submitted Successfully!</h2>
                <p class="lead">Your answers have been recorded.</p>
                <p>You may now close this browser window.</p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/live-test.js"></script> 
</body>
</html>

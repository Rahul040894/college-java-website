<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Problems - Java Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
</head>
<body>
    <!-- Your updated Header and new Master Navbar go here -->
    <main class="py-5">
        <div class="container">
            <div class="content-box" id="coding-container"></div>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="submissionToast" class="toast"><div class="toast-header bg-success text-white"><strong class="me-auto">Success!</strong><button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button></div><div class="toast-body">Your code has been submitted.</div></div>
        <div id="proctorToast" class="toast"><div class="toast-header"><strong class="me-auto">Action Disabled</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">Copy-paste and right-click are disabled.</div></div>
        <div id="visibilityToast" class="toast"><div class="toast-header bg-danger text-white"><strong class="me-auto">Warning!</strong><button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button></div><div class="toast-body">You have navigated away. The problem will be submitted.</div></div>
    </div>
</body>
</html>

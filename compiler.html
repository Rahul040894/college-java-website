<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Online Compiler - Java Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
</head>
<body>
    <main class="py-5">
        <div class="container">
            <div class="content-box">
                <h2>Java Online Compiler</h2>
                <p>Write, compile, and run your Java code. Academic integrity features are active.</p>
                <hr>
                <div class="row">
                    <div class="col-lg-8">
                        <h5>Your Code:</h5>
                        <div id="codeEditor" class="mb-3"></div>
                        <h5>Standard Input (stdin):</h5>
                        <textarea id="stdInput" class="form-control" rows="5" placeholder="Enter input here..."></textarea>
                    </div>
                    <div class="col-lg-4">
                        <h5>Output:</h5>
                        <pre id="outputArea" class="bg-dark text-white p-3 rounded" style="min-height: 500px; overflow-y: auto;">Output will appear here...</pre>
                    </div>
                </div>
                <div class="mt-3">
                    <button id="runButton" class="btn btn-success btn-lg">Run Code</button>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="proctorToast" class="toast"><div class="toast-header"><strong class="me-auto">Action Disabled</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">Copy-paste and right-click are disabled.</div></div>
    </div>
</body>
</html>
